workflows:
  ios-adhoc-ipa:
    name: iOS Sideloadable IPA (No Code Signing Required)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'master'
          include: true
          source: true
    scripts:
      - name: Flutter dependencies & code generation
        script: |
          flutter packages pub get
          flutter gen-l10n
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build iOS Application (unsigned)
        script: |
          flutter build ios --release --no-codesign
      - name: Package IPA for Sideloading
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Musify-unsigned.ipa Payload
          mkdir -p ../../output
          mv Musify-unsigned.ipa ../../output/
    artifacts:
      - build/output/Musify-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-release-signed:
    name: iOS App Store / TestFlight Signed IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    # If using a Codemagic UI integration for App Store Connect, uncomment below:
    # integrations:
    #   app_store_connect: my_app_store_connect_integration_name
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials # Set APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.gokadzev.musify"
    triggering:
      events:
        - tag
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Flutter dependencies & code generation
        script: |
          flutter packages pub get
          flutter gen-l10n
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # Optional: To publish to email or TestFlight automatically, you can uncomment below:
    # publishing:
    #   email:
    #     recipients:
    #       - your_email@example.com
    #     notify:
    #       success: true
    #       failure: true
    #   app_store_connect:
    #     api_key: $APP_STORE_CONNECT_PRIVATE_KEY
    #     key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
    #     issuer_id: $APP_STORE_CONNECT_ISSUER_ID
    #     submit_to_testflight: true
